# SIGINT Workbench — Docker Compose
#
# Dev mode (macOS):
#   1. Build & run sdr-capture natively:  make build-capture && ./bin/sdr-capture -config config/sdr-capture.yaml
#      (no hardware? -config config/sdr-capture.sim.yaml — two sim devices sharing one ingest port)
#   2. Start services:                    docker compose up
#   3. Start frontend:                    cd frontend && npm run dev
#
# Prod mode (Linux):
#   docker compose --profile prod up -d

services:
  # ─── SDR Capture (Linux prod only; on macOS run natively) ───
  sdr-capture:
    build:
      context: .
      dockerfile: docker/Dockerfile.sdr-capture
    profiles: ["prod"]
    devices:
      - /dev/bus/usb/001/002:/dev/bus/usb/001/002
      - /dev/bus/usb/001/003:/dev/bus/usb/001/003
    volumes:
      - ./config/sdr-capture.yaml:/config.yaml:ro
    # Stream targets come from the mounted YAML (stream_host/stream_port);
    # frames carry sdr_id, so several devices may share one ingest port.
    networks: [sdr-net]
    restart: unless-stopped

  # ─── Core Pipeline ───
  iq-ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile.services
      args: { SERVICE: iq-ingest }
    ports:
      - "${IQ_INGEST_UDP_PORT:-9000}:9000/udp"
    volumes:
      - ./config/iq-ingest.yaml:/config/iq-ingest.yaml:ro
    environment:
      - CONFIG=/config/iq-ingest.yaml
      - LISTEN_PORT=9000
      - CONSUMERS=signal-processor:9010,recorder:9011
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks: [sdr-net]
    restart: unless-stopped

  signal-processor:
    # ONNX-enabled build (cgo + ONNX Runtime on debian:bookworm-slim)
    build:
      context: .
      dockerfile: docker/Dockerfile.classifier
    volumes:
      - ./config/signal-processor.yaml:/config/signal-processor.yaml:ro
      - ./config/classifier.yaml:/config/classifier.yaml:ro
      - ./config/sdr-capture.yaml:/config/sdr-capture.yaml:ro
      - ./models:/models:ro
    environment:
      - LISTEN_PORT=9010
      - DB_URL=${DB_URL:-postgres://sdr:sdr@db:5432/sdr?sslmode=disable}
      - WS_HUB_URL=http://ws-hub:8081
      # §5.6 gain polling: host part of the capture control-API URL
      # (port comes from the shared sdr-capture.yaml api_port). Compose
      # default = the sdr-capture service (Linux prod); macOS dev sets
      # CAPTURE_API_HOST=host.docker.internal in .env (native capture).
      - CAPTURE_API_HOST=${CAPTURE_API_HOST:-sdr-capture}
      - SDR_CONFIG=/config/sdr-capture.yaml
      - PROCESSOR_CONFIG=/config/signal-processor.yaml
      - CLASSIFIER_CONFIG=/config/classifier.yaml
      - SIGNAL_TTL=30
      - MODEL_PATH=/models/classifier.onnx
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks: [sdr-net]
    depends_on: [iq-ingest, ws-hub]
    restart: unless-stopped

  recorder:
    # Opus-enabled build (cgo + libopus on debian:bookworm-slim, §10.4)
    build:
      context: .
      dockerfile: docker/Dockerfile.recorder
    ports:
      - "${RECORDER_UDP_PORT:-9011}:9011/udp"
    # No published TCP port: :9012/ws/audio (§10.4) is internal-only;
    # the api-gateway relays /ws/audio to ws://recorder:9012 (§3.2).
    volumes:
      - ./recordings:/recordings
      - ./config/recorder.yaml:/config.yaml:ro
    environment:
      - RECORDER_CONFIG=/config.yaml
      - DB_URL=${DB_URL:-postgres://sdr:sdr@db:5432/sdr?sslmode=disable}
      # §10.6: coarse audio.level feed to the hub (≤ 10 Hz).
      - WS_HUB_URL=http://ws-hub:8081
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks: [sdr-net]
    depends_on: [db]
    restart: unless-stopped

  # ─── API & Real-Time ───
  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.services
      args: { SERVICE: api-gateway }
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    environment:
      - DB_URL=${DB_URL:-postgres://sdr:sdr@db:5432/sdr?sslmode=disable}
      - RECORDINGS_DIR=/recordings
      - WS_HUB_ADDR=ws-hub:8081
      # /ws/audio relay target (§10.4): the recorder's internal
      # audio WS, reachable only on sdr-net.
      - RECORDER_WS_ADDR=recorder:9012
      # TFR proxy (§19.3): recorder-internal render endpoint, reachable
      # only on sdr-net; responses pass through with §19.3 statuses.
      - RECORDER_API_ADDR=recorder:9013
      # Control-API proxy (§7.4). In macOS dev capture runs natively
      # on the host — set CAPTURE_CTRL_ADDR=host.docker.internal:9090
      # in .env to reach it from the container.
      - CAPTURE_CTRL_ADDR=${CAPTURE_CTRL_ADDR:-sdr-capture:9090}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./recordings:/recordings:ro
    networks: [sdr-net]
    depends_on: [db, ws-hub, recorder]
    restart: unless-stopped

  ws-hub:
    build:
      context: .
      dockerfile: docker/Dockerfile.services
      args: { SERVICE: ws-hub }
    # No published ports (§3.2): clients reach ws-hub only through
    # the api-gateway /ws relay.
    environment:
      - DB_URL=${DB_URL:-postgres://sdr:sdr@db:5432/sdr?sslmode=disable}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks: [sdr-net]
    depends_on: [db]
    restart: unless-stopped

  # ─── Infrastructure ───
  db:
    image: postgis/postgis:16-3.4
    ports:
      # Dev/bench only (127.0.0.1): native signal-processor during
      # hardware validation (docs/HARDWARE.md §4 — macOS Docker drops
      # high-rate UDP, so ingest+processor run natively there) needs a
      # host-side DB. Production stays internal-only (§3.2).
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sdr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sdr}
      POSTGRES_DB: ${POSTGRES_DB:-sdr}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # No published ports (§3.2): only services on sdr-net reach the
    # database. Host-side access: docker compose exec db psql -U sdr -d sdr
    networks: [sdr-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdr -d sdr"]
      interval: 5s
      timeout: 5s
      retries: 5

  tiles:
    image: maptiler/tileserver-gl:latest
    ports:
      - "${TILE_SERVER_PORT:-8082}:8080"
    volumes:
      - ./tiles/config.yaml:/config.yaml:ro
      - ./tiles/data:/data:ro
    networks: [sdr-net]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
      # Vite env is baked at build time — these are URLs the BROWSER
      # can reach (host-published ports), not service DNS names.
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080/ws}
        VITE_TILE_URL: ${VITE_TILE_URL:-http://localhost:8082/data/{z}/{x}/{y}.pbf}
    ports:
      - "3000:80"
    networks: [sdr-net]
    depends_on: [api-gateway, tiles]
    restart: unless-stopped

volumes:
  db-data:

networks:
  sdr-net:
    driver: bridge