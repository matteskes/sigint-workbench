name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Go: vet + test ───
  go:
    name: Go (vet + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: Download ONNX Runtime (linux-x64)
        # 3c: give the onnx-tag tests a real runtime so they exercise the
        # full inference path (not just clean-failure paths). Same release
        # and lib/ layout as docker/Dockerfile.classifier.
        env:
          ORT_VERSION: "1.29.0"
        run: |
          curl -sfL -o ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          tar -xzf ort.tgz
          echo "ORT_LIBRARY_PATH=$(pwd)/onnxruntime-linux-x64-${ORT_VERSION}/lib/libonnxruntime.so" >> "$GITHUB_ENV"

      - name: Fetch ONNX model (git-lfs)
        # The E2E inference tests need the real model bytes. actions/checkout
        # fetches LFS by default; this is a cheap explicit guard so the tests
        # below cannot run against an unfetched LFS pointer.
        run: git lfs pull models/

      - name: go build + vet + test (onnx tag, real inference)
        # With ORT_LIBRARY_PATH + CLASSIFIER_ONNX_PATH set, the onnx build
        # tag runs the REAL CW + WFM E2E tests. go test alone exits 0 even
        # when those tests SKIP, so the grep guards below fail the job if the
        # inference tests did not actually run (e.g. model is an LFS pointer
        # or ORT failed to load) instead of silently passing.
        env:
          CLASSIFIER_ONNX_PATH: "${{ github.workspace }}/models/classifier.onnx"
        run: |
          go build -tags onnx ./...
          go vet -tags onnx ./...
          out="$(go test -tags onnx -v -count=1 ./internal/classify/ ./cmd/signal-processor/ 2>&1)" || test_rc=$?
          printf '%s\n' "$out"
          if [ "${test_rc:-0}" -ne 0 ]; then
            echo "FAIL: onnx-tag go test failed (rc=${test_rc})"
            exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'CW frame'   || { echo "FAIL: internal/classify ONNX E2E skipped (ORT_LIBRARY_PATH/model?)"; exit 1; }
          printf '%s\n' "$out" | grep -qF 'WFM frame'  || { echo "FAIL: internal/classify ONNX WFM E2E skipped (ORT_LIBRARY_PATH/model?)"; exit 1; }
          printf '%s\n' "$out" | grep -qF -e '-> peak' || { echo "FAIL: signal-processor ONNX E2E skipped (ORT_LIBRARY_PATH/model?)"; exit 1; }
          echo "OK: onnx real-inference E2E passed (CW + WFM)"

      - name: go build + vet + test (opus tag, real libopus)
        # §10.4/§17.3: the live-audio encoder is cgo (libopus), built only
        # with `-tags opus`. The tagged tests exercise the real encoder —
        # including the §17.3 TOC-0xF8 frame-counter obligation through the
        # recorder's /ws/audio server — so this step fails if they did not
        # actually run (same guard pattern as the onnx step above).
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libopus-dev libopusfile-dev
          go build -tags opus ./...
          go vet -tags opus ./...
          out="$(go test -tags opus -v -count=1 ./internal/audio/ ./internal/record/ 2>&1)" || test_rc=$?
          printf '%s\n' "$out"
          if [ "${test_rc:-0}" -ne 0 ]; then
            echo "FAIL: opus-tag go test failed (rc=${test_rc})"
            exit 1
          fi
          printf '%s\n' "$out" | grep -qF 'TestOpusEncoderFrameContract' || { echo "FAIL: opus encoder contract test missing"; exit 1; }
          printf '%s\n' "$out" | grep -qF 'TestWSAudioOpusFrameCounter' || { echo "FAIL: ws audio frame-counter test missing"; exit 1; }
          echo "OK: opus real-encoder E2E passed (encoder contract + WS frame counter)"

      - name: go build + vet (rtlsdr + hackrf tags, real SDR libraries)
        # §15: the hardware drivers are cgo and compile only with their
        # build tags. No SDR hardware exists in CI, so — same policy as
        # §15.3/§15.4 — these builds are compile-validated only (the H2
        # RX-only guard test runs untagged in `go test` above). The
        # combined build is what Dockerfile.sdr-capture ships.
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config librtlsdr-dev libhackrf-dev
          go build -tags rtlsdr ./...
          go vet -tags rtlsdr ./...
          go build -tags hackrf ./...
          go vet -tags hackrf ./...
          go build -tags "rtlsdr,hackrf" ./cmd/sdr-capture
          echo "OK: rtlsdr + hackrf tagged builds clean"

  # ─── Frontend: svelte-check ───
  frontend:
    name: Frontend (svelte-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate SvelteKit types
        working-directory: frontend
        run: npx svelte-kit sync

      - name: Type check
        working-directory: frontend
        run: npx svelte-check --tsconfig ./tsconfig.json

  # ─── Markdown lint ───
  markdown:
    name: Markdown (markdownlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run markdownlint
        run: npx markdownlint-cli2 "**/*.md"

  # ─── Docker vulnerability scan ───
  docker-scan:
    name: Docker (trivy vulnerability scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -f docker/Dockerfile.frontend -t sigint-frontend:scan ./frontend
          docker build -f docker/Dockerfile.sdr-capture -t sigint-sdr-capture:scan .
          docker build -f docker/Dockerfile.services --build-arg SERVICE=iq-ingest -t sigint-services:scan .
          docker build -f docker/Dockerfile.classifier -t sigint-classifier:scan .
          docker build -f docker/Dockerfile.recorder -t sigint-recorder:scan .

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan frontend image (CRITICAL + HIGH)
        run: |
          trivy image --exit-code 1 --severity CRITICAL,HIGH \
            --pkg-types os,library --ignore-unfixed --format table \
            sigint-frontend:scan

      - name: Scan sdr-capture image (CRITICAL)
        run: |
          trivy image --exit-code 1 --severity CRITICAL \
            --pkg-types os,library --ignore-unfixed --format table \
            sigint-sdr-capture:scan

      - name: Scan services image (CRITICAL)
        run: |
          trivy image --exit-code 1 --severity CRITICAL \
            --pkg-types os,library --ignore-unfixed --format table \
            sigint-services:scan

      - name: Scan classifier image (CRITICAL)
        run: |
          trivy image --exit-code 1 --severity CRITICAL \
            --pkg-types os,library --ignore-unfixed --format table \
            sigint-classifier:scan

      - name: Scan recorder image (CRITICAL)
        run: |
          trivy image --exit-code 1 --severity CRITICAL \
            --pkg-types os,library --ignore-unfixed --format table \
            sigint-recorder:scan
