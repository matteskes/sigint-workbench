# Classifier Configuration
model_path: models/classifier.onnx

# Rule-based classification (frequency band + bandwidth heuristics);
# enabled: false ⇒ peaks classify Unknown unless ONNX accepts them (§8.2)
rules:
  enabled: true

# ONNX ML classifier
onnx:
  enabled: true
  min_confidence: 0.5   # Below this, fall back to rules