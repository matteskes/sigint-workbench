# SIGINT Workbench — SDR Capture Configuration
# Used by: sdr-capture (native macOS or Docker on Linux)

# ─── IQ wire format (§4.5) ───
# sdr1 emits the classic 40-byte-header frames; sdr2 emits the
# sample-accurate v2 frames (per-sender seq + sample_index + ns
# CLOCK_REALTIME anchor) required for TDOA (§9.6). Keep sdr1 until
# every consumer of the stream accepts v2, then flip. Default: sdr1.
# stream_format: sdr1

# ─── Control API (§5.6 gain polling) ───
# Port of this capture instance's control API (the sdr-capture
# `-listen` flag, default 127.0.0.1:9090). Consumed by signal-processor,
# which polls the status endpoint to keep calibrated dBm values correct
# when gain changes at runtime. Omit to disable polling.

api_port: 9090
sdrs:
    - id: rtlsdr-0
      driver: rtlsdr
      usb_index: 0
      default_freq: 146520000
      default_gain: !!float 40
      default_bw: 2400000
      mode: scanner
      stream_host: localhost
      stream_port: 9000
      calibration_offset_db: -55.61
    - id: rtlsdr-1
      driver: rtlsdr
      usb_index: 1
      default_freq: 121500000
      default_gain: !!float 40
      default_bw: 2400000
      mode: monitor
      stream_host: localhost
      stream_port: 9000
      calibration_offset_db: -55.68
# Example: HackRF One (requires building sdr-capture with
# -tags "rtlsdr,hackrf"; without the tag, startup aborts with a clear
# error). serial selects the device — omit it to use the first found.
#  - id: "hackrf-0"
#    driver: hackrf
#    serial: "0x00000000000000000000000000000001"
#    default_freq: 433000000
#    default_gain: 30
#    default_bw: 10000000
#    mode: scanner
#    stream_host: localhost
#    stream_port: 9002

# ─── Scan loop (D3, docs/SPEC.md §7.1) ───
# Applies to every device with mode: scanner | both. Zero values use the
# documented defaults; the frequency range defaults to (and is clamped
# to) the driver's capability range.
scan:
    step_hz: 100000 # sweep step (default 100 kHz)
    dwell_ms: 50 # dwell per frequency (default 50 ms)
    # min_hz: 24000000    # sweep start (default: driver minimum, RTL-SDR 24 MHz)
    # max_hz: 1766000000  # sweep end   (default: driver maximum, RTL-SDR 1766 MHz)

    max_hz: 0
    min_hz: 0
