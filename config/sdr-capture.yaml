# SIGINT Workbench — SDR Capture Configuration
# Used by: sdr-capture (native macOS or Docker on Linux)

sdrs:
  - id: "rtlsdr-0"
    driver: rtlsdr
    usb_index: 0
    default_freq: 146520000    # 146.52 MHz (2m ham)
    default_gain: 40
    default_bw: 2400000        # 2.4 MHz (RTL-SDR max practical)
    mode: scanner              # scanner | monitor | both
    stream_host: localhost
    stream_port: 9000
    # Location (optional) — used by signal-processor to geo-locate
    # single-receiver signals on the map. Set lat+lon together.
    # lat: 40.7128
    # lon: -74.0060

  - id: "rtlsdr-1"
    driver: rtlsdr
    usb_index: 1
    default_freq: 121500000    # 121.5 MHz (guard frequency)
    default_gain: 40
    default_bw: 2400000
    mode: monitor
    stream_host: localhost
    stream_port: 9001

# Example: HackRF One (requires building sdr-capture with
# -tags "rtlsdr,hackrf"; without the tag, startup aborts with a clear
# error). serial selects the device — omit it to use the first found.
#  - id: "hackrf-0"
#    driver: hackrf
#    serial: "0x00000000000000000000000000000001"
#    default_freq: 433000000
#    default_gain: 30
#    default_bw: 10000000
#    mode: scanner
#    stream_host: localhost
#    stream_port: 9002

# ─── Scan loop (D3, docs/SPEC.md §7.1) ───
# Applies to every device with mode: scanner | both. Zero values use the
# documented defaults; the frequency range defaults to (and is clamped
# to) the driver's capability range.
scan:
  step_hz: 100000       # sweep step (default 100 kHz)
  dwell_ms: 50          # dwell per frequency (default 50 ms)
  # min_hz: 24000000    # sweep start (default: driver minimum, RTL-SDR 24 MHz)
  # max_hz: 1766000000  # sweep end   (default: driver maximum, RTL-SDR 1766 MHz)