# Signal Processor Configuration
listen_port: 9010

# Peak detection
peak_detection:
  threshold_db: -60
  # B4: a peak must clear the spectrum's own noise floor (median of
  # the lower half of bins) by this many dB to be published. The
  # absolute threshold_db gates uncalibrated dBFS and rides along
  # with §5.6 calibration; the SNR gate is scale-free, so
  # uncorrelated noise spikes die here while real carriers clear it
  # by 20+ dB at the bugcheck's gains. ResolveFloat treats 0 as
  # "unset" -> the shipped default 10, not "disabled".
  min_snr_db: 10
  min_spacing_bins: 10
  max_peaks: 20

# FFT settings (§5.7, wired)
fft:
  # IQ pairs per assembled FFT buffer. Frames arrive as <=1024-pair
  # UDP packets; consecutive same-source frames (keyed by sdr_id +
  # tuned frequency) are concatenated until this many pairs are ready.
  # 4096 pairs = 2048 one-sided bins at 1 kHz — the geometry the ONNX
  # model was trained on (models/train.py NFFT).
  # Unnormalized FFT power scales with size: the -60 dB peak threshold
  # and the §5.6 calibration offsets are valid only at the calibrated
  # geometry — changing size forces a rtl-calibrate re-run
  # (docs/HARDWARE.md §6.2, -fft-size).
  size: 4096
  # Window applied before the FFT. rectangular matches the unwindowed
  # ONNX training; hann | hamming | blackman change the spectrum shape
  # and power scale, so switching requires retraining the model
  # (train.py must mirror the window) AND a §6.2 recalibration.
  window: rectangular

# The D3 scan loop is configured per device in sdr-capture.yaml (§7.1);
# a `scan:` block that lived here was never read by the processor and
# has been removed (STACK-AUDIT A8).

# TDOA engine (§9.6) — disabled until §4.5 v2 frames flow
# (sdr-capture stream_format: sdr2) and receivers carry lat/lon.
# tdoa:
#   enabled: true
#   window_ms: 10               # common observation window
#   buffer_horizon_ms: 500      # alignment-buffer horizon (§9.5)
#   pair_cap: 15                # all-pairs above C(N,2) > cap → star
#   outlier_sigma: 3            # normalized-residual rejection gate
#   accuracy_budget_m: 200      # fix gate (50 in the simulator)
#   overwrite_placement: true   # covariance-gated §9.3 overwrite
#   locus_radius_m: 0           # 0 ⇒ 3× the pair's baseline
#   solve_rate_hz: 0            # 0 ⇒ bandwidth-derived (default 250 kS/s)

# Spectrum tap (§18) — decimated per-SDR power spectrum feeding the
# dashboard spectrum/waterfall. A read-only side-tap on the assembled
# §5.7 FFT: detection is untouched. Frames ride the ws-hub producer
# queue's drop-never-block path, so saturation skips waterfall rows
# (§14.3) rather than backing up DSP.
spectrum:
  # §18.4: false yields zero events and zero tap allocation.
  enabled: true
  # Decimated bin count; MUST divide fft.size (§18.1). 4096 / 256 =
  # 16 source bins per displayed bin. A value that does not divide
  # fft.size is clamped at startup to the nearest valid divisor.
  bins: 256
  # Max frames per second per SDR. A cap, not a guarantee: a record
  # exists only once fft.size pairs have assembled, so retunes and
  # UDP loss show as real gaps in the waterfall (§18.1).
  rate_hz: 5