# Recorder Configuration
recordings_dir: /recordings
listen_port: 9011       # UDP IQ in (iq-ingest CONSUMERS fan-out)

# Audio encoding
audio:
  sample_rate: 48000
  format: wav          # wav only — FLAC is not supported (docs/SPEC.md §10.5)
  channels: 1

# IQ recording (§10.5): a second, headerless int16-LE file of the
# shifted baseband per session, plus a file_format='iq' DB row.
iq:
  enabled: true
  format: raw          # raw (int16 interleaved, little-endian)
  max_duration_s: 300  # session cap, §11.1; negative disables the cap

# In-band audio capture (D1, §10.2): the recorder demodulates tracked
# signals straight off the shared IQ stream — no extra tuners.
capture:
  close_silence_s: 10  # finalize a session after this much silence
  max_concurrent: 8    # simultaneous recordings (strongest-first later)

# Retention (§11)
retention:
  max_age_days: 30
  max_size_gb: 50

# Live audio (D1b, §10.4): per-signal Opus over WebSocket. The
# api-gateway relays /ws/audio here (slice 5); this port stays
# internal-only (§3.2). Requires an opus-tagged build (libopus) —
# without it the server is skipped and recording is unaffected.
stream:
  listen_port: 9012
  bitrate_bps: 24000  # 24 kbps CBR, mono, 20 ms frames (960 samples)

# Time-frequency analysis (§19, D10): on-demand high-resolution TFR
# renders over stored raw-IQ recordings, computed here (§19.1). The
# api-gateway proxies POST /api/recordings/{id}/tfr to this port
# (§13.1); it stays internal-only (§3.2). Disabled by default (§19.5)
# — while disabled the endpoint answers 404 (§19.3).
tfr:
  enabled: false
  max_span_s: 30     # largest requestable span (§19.3 ⇒ 413 beyond)
  max_nfft: 16384    # per-request nfft cap (§19.2)
  listen_port: 9013  # internal TFR API